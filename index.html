<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcards From My Jungle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<main class="scene">
    <img id="background" alt="Jungle postcard slideshow image">
    <div class="fog"></div>

    <div class="title-wrap">
        <p class="eyebrow">field notes</p>
        <h1>postcards from my jungle</h1>
    </div>

    <div class="hud">
        <button id="audio-toggle" type="button">sound: on</button>
        <p id="slide-counter">01 / 50</p>
    </div>
</main>

<audio id="ambience" preload="auto"></audio>
<script src="script.js" defer></script>
</body>
</html>
