<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postcards From My Jungle</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    font-family: Helvetica, Arial, sans-serif;
}

#background {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 3s ease-in-out;
}

#overlay {
    position: fixed;
    bottom: 30px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<button onclick="document.getElementById('ambience').play()" 
style="position:fixed;top:20px;left:20px;z-index:10;">
Enter Jungle
</button>

<img id="background">

<div id="overlay">
    postcards from my jungle
</div>

<audio id="ambience" autoplay loop>
    <source src="audio/jungle_ambience.mp3" type="audio/mpeg">
</audio>

<script>
const imageElement = document.getElementById("background");
const totalImages = 50;
let currentImage = 1;

function changeImage() {
    imageElement.style.opacity = 0;

    setTimeout(() => {
        imageElement.src = `images/jungle_beast_${currentImage}.png`;
        imageElement.style.opacity = 1;
        currentImage++;
        if (currentImage > totalImages) currentImage = 1;
    }, 3000);
}

// initial load
imageElement.src = "images/jungle_beast_1.png";
imageElement.style.opacity = 1;

setInterval(changeImage, 8000);
</script>

</body>
</html>
